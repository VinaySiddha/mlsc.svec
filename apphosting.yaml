# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 10

# All variables that need to be available at build and runtime.
# These variables are not secret and are safe to be stored in your code repository.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDZz0vWiVJHkqeQW5LUAaKOX7sxRTn25a0"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "mlsc-30.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "mlsc-30"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "mlsc-30.appspot.com"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "376409105264"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:376409105264:web:fe8daa1d8724e7d13e25b5"

# Secrets (These must match the Secret Name in Google Cloud Secret Manager)
secretParameters:
  - secret: JWT_SECRET
    key: JWT_SECRET
  - secret: GOOGLE_API_KEY
    key: GOOGLE_API_KEY
  - secret: GMAIL_USER
    key: GMAIL_USER
  - secret: GMAIL_APP_PASSWORD
    key: GMAIL_APP_PASSWORD
  - secret: JSEARCH_API_KEY
    key: JSEARCH_API_KEY
